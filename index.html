<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Tab-Icon folgt dem Systemdesign; iOS nutzt fürs Home-Bildschirm-Icon
     ausschließlich apple-touch-icon.png (kein Dark-Mode-Wechsel möglich). -->
<link rel="icon" href="icon-192.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon-192-dark.png" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">
<title>BaugutAssist</title>
</head>
<body>
<div id="app"></div>
<!-- Der Code liegt in ES-Modulen unter js/ — kein Build-Step nötig, der
     Browser lädt sie selbst. Wegen der Modul-Herkunftsregeln startet die
     App nicht mehr per Doppelklick (file://), sondern nur über einen
     Server: start-demo.bat bzw. `python -m http.server`. -->
<script type="module" src="app.js"></script>
</body>
</html>
